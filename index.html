<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de horas</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app">

  <!-- ===== PANTALLA: LOGIN / CREAR CUENTA ===== -->
  <section id="pantallaLogin" class="pantalla">
    <div class="card">
      <h2 class="card-title" id="loginTitulo">Iniciar sesión</h2>
      <p style="font-size:12px;color:var(--text-secondary);margin:-8px 0 14px">Control de Horas</p>

      <label class="field-label">Usuario</label>
      <input type="text" id="loginUsuario" placeholder="Nombre del GS">

      <label class="field-label">Clave</label>
      <input type="password" id="loginClave" placeholder="Tu clave">

      <div id="loginConfirmarContenedor" class="oculta">
        <label class="field-label">Confirmar clave</label>
        <input type="password" id="loginConfirmarClave" placeholder="Repetí la clave">
      </div>

      <p id="loginError" class="aviso-error" style="display:none"></p>

      <button id="btnLogin" class="btn-principal">Ingresar</button>
      <p id="linkAlternarModo" class="link-alternar">¿No tenés cuenta? Creá una nueva</p>
    </div>
  </section>

  <!-- ===== CONTENIDO PRINCIPAL (visible solo con sesión iniciada) ===== -->
  <div id="contenidoApp" class="oculta">

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z"/>
          <circle cx="12" cy="11" r="2.2"/>
          <path d="M12 13.2v2.3"/>
        </svg>
      </span>
      <div>
        <h1>Control de Horas</h1>
        <p class="brand-sub" id="saludoUsuario">Seguimiento de turnos</p>
      </div>
    </div>
    <button id="btnCerrarSesion" class="brand-clock" title="Cerrar sesión" aria-label="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <path d="M16 17l5-5-5-5"/>
        <path d="M21 12H9"/>
      </svg>
    </button>
  </header>

  <nav class="tabs">
    <button id="tabTurno" class="tab active">Turno</button>
    <button id="tabHistorial" class="tab">Historial</button>
  </nav>

  <!-- ===== PANTALLA: NUEVO TURNO ===== -->
  <section id="pantallaTurno" class="pantalla">

    <div class="card">
      <h2 class="card-title">Nuevo turno</h2>

      <label class="field-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        Lugar / objetivo
      </label>
      <input type="text" id="lugar" placeholder="Ej: Edificio San Martín">

      <label class="field-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
        Fecha
      </label>
      <input type="date" id="fecha">

      <div class="fila">
        <div>
          <label class="field-label entrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            Hora entrada
          </label>
          <input type="time" id="horaEntrada" value="20:00">
        </div>
        <div>
          <label class="field-label salida">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            Hora salida
          </label>
          <input type="time" id="horaSalida" value="06:00">
        </div>
      </div>
    </div>

    <div class="card resultado" id="resultado" style="display:none">
      <div class="stats-grid">
        <div class="stat">
          <span class="stat-label">Total turno</span>
          <strong id="totalTurno" class="stat-value azul">0 hs</strong>
        </div>
        <div class="stat">
          <span class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            Nocturnas
          </span>
          <strong id="horasNocturnas" class="stat-value violeta">0 hs</strong>
        </div>
        <div class="stat">
          <span class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.3L22 9l-5 4.9 1.2 7.1L12 17.8 5.8 21l1.2-7.1L2 9l7.1-.7L12 2z"/></svg>
            Extra semana
          </span>
          <strong id="horasExtraTurno" class="stat-value naranja">0 hs</strong>
        </div>
      </div>
      <p id="avisoExtra" class="aviso" style="display:none"></p>
    </div>

    <div class="card caja-pregunta">
      <label class="check">
        <input type="checkbox" id="pasoAlgo">
        <span class="check-box"></span>
        ¿Pasó algo en el turno?
      </label>
      <textarea id="nota" placeholder="Contá qué pasó (obligatorio si marcaste que pasó algo)" style="display:none"></textarea>
    </div>

    <button id="btnGuardarTurno" class="btn-principal">Guardar turno</button>
    <button id="btnGuardarFranco" class="btn-secundario">Marcar este día como franco</button>

    <div class="card">
      <h3 class="card-subtitle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
        Resumen
      </h3>
      <div class="grid-resumen">
        <div class="metrica verde">
          <span>Horas semana</span>
          <strong id="resHorasSemana">0</strong>
          <div class="barra"><div class="barra-fill" id="barraSemana"></div></div>
        </div>
        <div class="metrica naranja">
          <span>Extra semana</span>
          <strong id="resExtraSemana">0</strong>
        </div>
        <div class="metrica azul">
          <span>Horas del mes</span>
          <strong id="resHorasMes">0</strong>
        </div>
        <div class="metrica violeta">
          <span>Francos del mes</span>
          <strong id="resFrancosMes">0</strong>
        </div>
      </div>
    </div>

  </section>

  <!-- ===== PANTALLA: HISTORIAL ===== -->
  <section id="pantallaHistorial" class="pantalla oculta">

    <div class="card">
      <h2 class="card-title">Historial</h2>

      <div class="fila">
        <input type="date" id="filtroDesde">
        <input type="date" id="filtroHasta">
      </div>
      <input type="text" id="filtroLugar" placeholder="Buscar por lugar...">

      <button id="btnExportarPDF" class="btn-pdf">Exportar a PDF</button>
    </div>

    <div id="listaHistorial" class="lista-historial"></div>

    <div id="detalleTurno" class="detalle-turno" style="display:none"></div>

  </section>

  </div>
  <!-- cierra #contenidoApp -->

</div>

<script src="app.js"></script>
</body>
</html>
