<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de horas</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app">

  <div class="tabs">
    <button id="tabTurno" class="tab active">Turno</button>
    <button id="tabHistorial" class="tab">Historial</button>
  </div>

  <!-- ===== PANTALLA: NUEVO TURNO ===== -->
  <section id="pantallaTurno" class="pantalla">

    <h2>Nuevo turno</h2>

    <label>Lugar / objetivo</label>
    <input type="text" id="lugar" placeholder="Ej: Edificio San Martín">

    <label>Fecha</label>
    <input type="date" id="fecha">

    <div class="fila">
      <div>
        <label>Hora entrada</label>
        <input type="time" id="horaEntrada" value="20:00">
      </div>
      <div>
        <label>Hora salida</label>
        <input type="time" id="horaSalida" value="06:00">
      </div>
    </div>

    <div class="resultado" id="resultado" style="display:none">
      <div class="fila-resultado">
        <span>Total del turno</span>
        <strong id="totalTurno">0 hs</strong>
      </div>
      <div class="fila-resultado sub">
        <span>Horas nocturnas (22 a 6)</span>
        <strong id="horasNocturnas">0 hs</strong>
      </div>
    </div>

    <div id="avisoExtra" class="aviso" style="display:none"></div>

    <div class="caja-pregunta">
      <label class="check">
        <input type="checkbox" id="pasoAlgo">
        ¿Pasó algo en el turno?
      </label>
      <textarea id="nota" placeholder="Contá qué pasó (obligatorio si marcaste que pasó algo)" style="display:none"></textarea>
    </div>

    <button id="btnGuardarTurno" class="btn-principal">Guardar turno</button>
    <button id="btnGuardarFranco" class="btn-secundario">Marcar este día como franco</button>

    <h3>Resumen</h3>
    <div class="grid-resumen">
      <div class="metrica">
        <span>Horas semana</span>
        <strong id="resHorasSemana">0</strong>
      </div>
      <div class="metrica">
        <span>Extra semana</span>
        <strong id="resExtraSemana">0</strong>
      </div>
      <div class="metrica">
        <span>Horas del mes</span>
        <strong id="resHorasMes">0</strong>
      </div>
      <div class="metrica">
        <span>Francos del mes</span>
        <strong id="resFrancosMes">0</strong>
      </div>
    </div>

  </section>

  <!-- ===== PANTALLA: HISTORIAL ===== -->
  <section id="pantallaHistorial" class="pantalla oculta">

    <h2>Historial</h2>

    <div class="fila">
      <input type="date" id="filtroDesde">
      <input type="date" id="filtroHasta">
    </div>
    <input type="text" id="filtroLugar" placeholder="Buscar por lugar...">

    <button id="btnExportarPDF" class="btn-secundario">Exportar a PDF</button>

    <div id="listaHistorial" class="lista-historial"></div>

    <div id="detalleTurno" class="detalle-turno" style="display:none"></div>

  </section>

</div>

<script src="app.js"></script>
</body>
</html>
